name: Android APK

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android.yml'
      - 'android-app/**'
      - 'index.html'
      - 'style.css'
      - 'game.js'
      - 'three.module.js'
      - 'THREE-LICENSE.txt'
      - 'Теневой_монстр.glb'
      - 'vendor/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: do-shesti-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
