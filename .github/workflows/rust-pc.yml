name: Rust PC

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/rust-pc.yml'
      - 'rust-pc/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/rust-pc.yml'
      - 'rust-pc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-pc

      - name: Build release
        run: cargo build --release --manifest-path rust-pc/Cargo.toml

      - name: Stage assets next to executable
        run: Copy-Item -Recurse rust-pc/assets rust-pc/target/release/assets
        shell: pwsh

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: do-shesti-windows
          path: |
            rust-pc/target/release/do-shesti.exe
            rust-pc/target/release/assets
          retention-days: 14
