plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.doshesti.game'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.doshesti.game'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
